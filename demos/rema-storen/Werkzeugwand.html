  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ab4e715d-945d-4ed8-a598-51bc78f07748\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n\n<style>\n  body { margin: 0; background: transparent; -webkit-font-smoothing: antialiased; }\n  a { color: #B0C4DE; text-decoration: none; }\n  a:hover { color: #FFFFFF; }\n  @keyframes wwPulse {\n    0%, 100% { box-shadow: 0 0 0 0 rgba(176,196,222,0.0); border-color: rgba(176,196,222,0.35); }\n    50% { box-shadow: 0 0 22px 2px rgba(176,196,222,0.35); border-color: rgba(176,196,222,0.95); }\n  }\n  @keyframes wwNudge {\n    0%, 100% { transform: translateY(0); }\n    50% { transform: translateY(4px); }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width: 100%; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #FFFFFF;\">\n\n  <div style=\"position: relative; display: flex; align-items: stretch; justify-content: center; overflow: hidden;\">\n    <!-- Breite der Bildsäule: früher an die Fensterhöhe gebunden (128vh). Eingebettet\n         war das ein Kreis — der Rahmen richtet sich nach dem Inhalt, der Inhalt nach\n         der Rahmenhöhe. Jetzt an der Breite bemessen (siehe saeuleW in renderVals);\n         was rechts und links übrig bleibt, füllt der unscharfe Streifen. -->\n    <div style=\"position: relative; flex: none; width: 100%; max-width: 1160px;\">\n    <div style=\"position: relative;\">\n      <img src=\"790cabf4-d246-4222-a557-7f9d7a7a0572\" alt=\"Werkzeugwand mit Zollstock, Wasserwaage und Kabeltrommel, darunter eine lange Zange\" style=\"display: block; width: 100%; height: auto; transform: {{ zoom }}; transform-origin: 50% 0;\">\n\n      <sc-if value=\"{{ isDesktop }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position: absolute; inset: 0;\">\n          <div style=\"{{ bracketStyle }}\">\n            <span style=\"{{ bracketLabelStyle }}\">gilt für alle drei<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ hotspots }}\" as=\"h\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-mouse-enter=\"{{ h.enter }}\" sc-camel-on-mouse-leave=\"{{ h.leave }}\" sc-camel-on-focus=\"{{ h.enter }}\" sc-camel-on-blur=\"{{ h.leave }}\" sc-camel-on-click=\"{{ h.pin }}\" aria-label=\"{{ h.tool }}\" style=\"{{ h.boxStyle }}\">\n              <span style=\"{{ h.labelStyle }}\">{{ h.tool }}<\u002Fspan>\n              <span style=\"{{ h.dotStyle }}\">\n                <svg sc-camel-view-box=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"currentColor\" aria-hidden=\"true\" style=\"flex: none;\"><path d=\"M5 2.5 19.2 11.4a.7.7 0 0 1-.25 1.28l-5.6 1.05 3.1 5.42a.7.7 0 0 1-.27.95l-1.9 1.08a.7.7 0 0 1-.95-.27l-3.08-5.4-3.9 4.16A.7.7 0 0 1 5.16 19.2V3.1a.7.7 0 0 1 1.07-.6Z\"><\u002Fpath><\u002Fsvg>\n                {{ h.dotSign }}\n              <\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position: absolute; inset: 0; transform: {{ zoom }}; transform-origin: 50% 0;\">\n          <sc-for list=\"{{ hotspots }}\" as=\"h\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ h.toggle }}\" aria-label=\"{{ h.tool }}\" style=\"{{ h.boxStyleM }}\"><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"{{ benchStyle }}\"><\u002Fdiv>\n    <div style=\"position: absolute; left: 0; right: 0; bottom: 0; height: 26%; background: linear-gradient(180deg, rgba(26,39,68,0) 0%, rgba(20,31,55,0.55) 100%); pointer-events: none;\"><\u002Fdiv>\n\n    <sc-if value=\"{{ isDesktop }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position: absolute; top: 0; left: 0; right: 0; padding-top: 44%; pointer-events: none;\">\n      <div ref=\"{{ panelRef }}\" style=\"{{ panelStyle }}\">\n        <sc-if value=\"{{ isArea }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 8px;\">\n            <span style=\"display: inline-block; background: #B0C4DE; color: #1A2744; font-weight: 700; font-size: clamp(12px, 1.1vw, 14px); letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 11px; border-radius: 3px;\">{{ panelTool }}<\u002Fspan>\n            <span style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(176,196,222,0.75);\">{{ panelKind }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family: Georgia, serif; font-weight: 700; font-size: clamp(21px, 2.1vw, 26px); line-height: 1.2; color: #FFFFFF;\">{{ panelTitle }}<\u002Fdiv>\n          <div style=\"{{ contentStyle }}\">\n            <p style=\"{{ bridgeStyle }}\">{{ panelBridge }}<\u002Fp>\n            <div style=\"{{ examplesStyle }}\">\n              <sc-for list=\"{{ panelExamples }}\" as=\"x\" hint-placeholder-count=\"3\">\n                <div style=\"display: flex; gap: 8px; align-items: flex-start;\">\n                  <span style=\"flex: none; color: #B0C4DE; font-weight: 700; line-height: 1.35;\">›<\u002Fspan>\n                  <span style=\"font-size: clamp(14px, 1.2vw, 16px); line-height: 1.4; color: #DCE6F2; text-wrap: pretty;\"><span style=\"font-weight: 700; color: #FFFFFF;\">{{ x.t }}<\u002Fspan> {{ x.d }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleDetail }}\" style=\"{{ detailBtnStyle }}\">{{ detailBtnLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isFault }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 8px;\">\n            <span style=\"display: inline-block; background: #FFFFFF; color: #1A2744; font-weight: 700; font-size: clamp(12px, 1.1vw, 14px); letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 11px; border-radius: 3px;\">Support &amp; Betrieb<\u002Fspan>\n            <span style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.85);\">Über alle drei Bereiche hinweg<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family: Georgia, serif; font-weight: 700; font-size: clamp(21px, 2.1vw, 26px); line-height: 1.2; color: #FFFFFF;\">Ihr digitaler Generalunternehmer.<\u002Fdiv>\n          <div style=\"{{ contentStyle }}\">\n            <p style=\"{{ bridgeStyle }}\">Wie auf dem Bau: Sie reden mit einem, der Rest läuft im Hintergrund. <span style=\"font-style: normal; font-weight: 700; color: #FFFFFF;\">Ob Handwerker-Software, IT oder Website<\u002Fspan> — wir lösen es.<\u002Fp>\n            <div style=\"{{ examplesStyle }}\">\n              <sc-for list=\"{{ panelExamples }}\" as=\"x\" hint-placeholder-count=\"3\">\n                <div style=\"display: flex; gap: 8px; align-items: flex-start;\">\n                  <span style=\"flex: none; color: #FFFFFF; font-weight: 700; line-height: 1.35;\">›<\u002Fspan>\n                  <span style=\"font-size: clamp(14px, 1.2vw, 16px); line-height: 1.4; color: #DCE6F2; text-wrap: pretty;\"><span style=\"font-weight: 700; color: #FFFFFF;\">{{ x.t }}<\u002Fspan> {{ x.d }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleDetail }}\" style=\"{{ detailBtnStyle }}\">{{ detailBtnLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background: #1A2744;\">\n      <sc-for list=\"{{ hotspots }}\" as=\"h\" hint-placeholder-count=\"4\">\n        <div style=\"border-top: 1px solid rgba(176,196,222,0.22);\">\n          <button type=\"button\" sc-camel-on-click=\"{{ h.toggle }}\" style=\"{{ h.rowStyle }}\">\n            <span style=\"flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; align-items: flex-start;\">\n              <span style=\"{{ h.chipStyle }}\">{{ h.tool }}<\u002Fspan>\n              <span style=\"font-family: Georgia, serif; font-weight: 700; font-size: 18px; line-height: 1.25; color: #FFFFFF; text-wrap: pretty;\">{{ h.title }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"{{ h.plusStyle }}\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"display: grid; grid-template-rows: {{ h.rows }}; transition: grid-template-rows 260ms ease;\">\n            <div style=\"overflow: hidden;\">\n              <p style=\"margin: 0; padding: 0 16px 14px; font-family: Georgia, serif; font-style: italic; font-size: 16px; line-height: 1.5; color: #DCE6F2; text-wrap: pretty;\">{{ h.bridge }}<\u002Fp>\n              <div style=\"display: flex; flex-direction: column; gap: 9px; padding: 0 16px 16px;\">\n                <sc-for list=\"{{ h.examples }}\" as=\"x\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; gap: 9px; align-items: flex-start;\">\n                    <span style=\"flex: none; color: #B0C4DE; font-weight: 700; line-height: 1.35;\">›<\u002Fspan>\n                    <span style=\"font-size: 14px; line-height: 1.4; color: #DCE6F2; text-wrap: pretty;\"><span style=\"font-weight: 700; color: #FFFFFF;\">{{ x.t }}<\u002Fspan> {{ x.d }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ h.isFault }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding: 0 16px 18px;\">\n                  <div style=\"border-left: 2px solid rgba(255,255,255,0.7); padding-left: 12px; margin-bottom: 12px;\">\n                    <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #FFFFFF; margin-bottom: 7px;\">Bei drei Anbietern<\u002Fdiv>\n                    <sc-for list=\"{{ excuses }}\" as=\"e\" hint-placeholder-count=\"3\">\n                      <div style=\"display: flex; gap: 8px; font-size: 14px; line-height: 1.45; margin-bottom: 4px;\">\n                        <span style=\"flex: none; font-weight: 700; color: rgba(255,255,255,0.95);\">{{ e.who }}<\u002Fspan>\n                        <span style=\"color: rgba(220,230,242,0.8);\">{{ e.quote }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <div style=\"margin-top: 8px; font-size: 14px; font-weight: 700; color: #FFFFFF;\">Jeder verweist auf den nächsten, der Kunde wartet.<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"border-left: 2px solid #B0C4DE; padding-left: 12px;\">\n                    <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #B0C4DE; margin-bottom: 7px;\">Bei uns<\u002Fdiv>\n                    <p style=\"margin: 0; font-family: Georgia, serif; font-style: italic; font-size: 16px; line-height: 1.45; color: #DCE6F2;\">Egal welches Werkzeug klemmt: ein Anruf, wir klären es untereinander.<\u002Fp>\n                    <div style=\"margin-top: 8px; font-size: 14px; font-weight: 700; color: #FFFFFF;\">1 Anruf · 1 Zuständiger · erledigt.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:620},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B0C4DE&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#B0C4DE&quot;,&quot;#FFFFFF&quot;,&quot;#1A2744&quot;]}}\">\nconst TOOLS = [\n  { tool: \"Zollstock\", kind: \"Bereich 1 von 3\", title: \"Handwerker-Software & Prozesse\",\n    bridge: \"Auf der Baustelle messen Sie exakt. Im Büro genauso — die Software misst mit.\",\n    box: { left: \"27%\", top: \"11%\", width: \"8.5%\", height: \"37%\" },\n    examples: [\n      { t: \"Offerten:\", d: \"Preise hinterlegt, Sie wählen aus statt zu tippen.\" },\n      { t: \"Stunden:\", d: \"Der Monteur erfasst am Handy, Sie tragen nichts nach.\" },\n      { t: \"Marge:\", d: \"Pro Auftrag sichtbar, nicht erst am Jahresende.\" }\n    ] },\n  { tool: \"Wasserwaage\", kind: \"Bereich 2 von 3\", title: \"IT, Geräte & Daten im Lot\",\n    bridge: \"Die Wasserwaage zeigt, wenn etwas krumm sitzt. Genauso wir bei Ihrer Technik.\",\n    box: { left: \"47.5%\", top: \"9.5%\", width: \"5.5%\", height: \"48%\" },\n    examples: [\n      { t: \"Es läuft:\", d: \"Mail, Drucker, WLAN — hängt etwas, sind wir dran.\" },\n      { t: \"Alles dabei:\", d: \"Pläne, Fotos, Masse am Handy.\" },\n      { t: \"Ausfall:\", d: \"Wir organisieren den Ersatz, nicht Sie.\" }\n    ] },\n  { tool: \"Kabeltrommel\", kind: \"Bereich 3 von 3\", title: \"Website & Auffindbarkeit\",\n    bridge: \"Die Kabeltrommel ist Ihre Verbindung nach draussen. Genauso die Website — zu Kunden und künftigen Mitarbeitern.\",\n    box: { left: \"62.5%\", top: \"12%\", width: \"14%\", height: \"35%\" },\n    examples: [\n      { t: \"Kundenanfragen:\", d: \"Ein Chatbot klärt die ersten Fragen.\" },\n      { t: \"Foto statt Anfahrt:\", d: \"Kunde lädt Bild und Masse hoch.\" },\n      { t: \"Mitarbeitersuche:\", d: \"Bewerbung direkt ab Handy.\" }\n    ] },\n  { tool: \"Zange\", kind: \"Support & Betrieb · greift bei allen drei\", title: \"Support & Betrieb\", fault: true,\n    bridge: \"Die Zange packt dort, wo es festsitzt. Genau dann sind wir dran: einer, der zupackt, statt drei, die aufeinander zeigen.\",\n    box: { left: \"19%\", top: \"62%\", width: \"63%\", height: \"13%\" },\n    examples: [\n      { t: \"Eine Nummer:\", d: \"Ob Software, IT oder Website.\" },\n      { t: \"Wir koordinieren:\", d: \"Ihre Treuhand — damit der Übergang läuft.\" },\n      { t: \"Wir bleiben dran:\", d: \"Bis es wirklich läuft.\" }\n    ] }\n];\n\nconst EXCUSES = [\n  { who: \"Software\",        quote: \"«Bei uns ist sie raus.»\" },\n  { who: \"IT\",              quote: \"«Der Mailserver blockiert nichts.»\" },\n  { who: \"Website\",         quote: \"«Das Formular ist nicht von mir.»\" }\n];\n\nclass Component extends DCLogic {\n  state = { active: null, desktop: true, open: null, detail: null, touched: false, benchPx: 0, contentH: 0 };\n  panelRef = React.createRef();\n\n  measureBench() {\n    // Die Bank wird nur dort höher, wo das Textfeld darauf steht — also auf dem\n    // Desktop. Auf dem Handy liegt die Liste unter dem Bild; ein Rest aus einer\n    // früheren Messung bliebe sonst als leerer Streifen stehen.\n    if (!this.state.desktop) {\n      if (this.state.benchPx) this.setState({ benchPx: 0 });\n      return;\n    }\n    const el = this.panelRef.current;\n    if (!el || !el.parentElement) return;\n    const W = el.parentElement.offsetWidth;\n    if (!W) return;\n    // Panel startet bei 44% der Breite, das Foto ist 768/1376 hoch — daraus die nötige Bankhöhe.\n    const need = Math.ceil(0.44 * W + el.offsetHeight + 12 - (768 / 1376) * W);\n    const px = Math.max(0, need);\n    if (Math.abs(px - this.state.benchPx) > 2) this.setState({ benchPx: px });\n  }\n\n  componentDidMount() {\n    this.mq = window.matchMedia(\"(min-width: 860px) and (hover: hover)\");\n    this.sync = () => this.setState({ desktop: this.mq.matches });\n    this.sync();\n    this.mq.addEventListener(\"change\", this.sync);\n    this.ro = new ResizeObserver(() => { this.measureBench(); this.post(); });\n    this.ro.observe(document.body);\n    this.measureBench();\n    if (this.panelRef.current) {\n      this.pro = new ResizeObserver(() => { this.measureBench(); this.post(); });\n      this.pro.observe(this.panelRef.current);\n    }\n    this.post();\n  }\n  componentWillUnmount() {\n    clearTimeout(this.hoverT);\n    clearTimeout(this.measureT);\n    if (this.pro) this.pro.disconnect();\n    if (this.mq) this.mq.removeEventListener(\"change\", this.sync);\n    if (this.ro) this.ro.disconnect();\n  }\n  componentDidUpdate() {\n    this.measureBench();\n    // Beispiele klappen animiert auf — nach der Transition nachmessen.\n    clearTimeout(this.measureT);\n    this.measureT = setTimeout(() => { this.measureBench(); this.post(); }, 340);\n    this.post();\n  }\n  post() {\n    if (window.parent === window) return;\n    window.parent.postMessage({ type: \"werkzeugwand-resize\", height: document.body.scrollHeight }, \"*\");\n  }\n\n  renderVals() {\n    const accent = this.props.accentColor ?? \"#B0C4DE\";\n    const desktop = this.state.desktop;\n    // Aufgeklappte Details halten die Auswahl fest, bis ein anderes Werkzeug gewählt wird.\n    const a = this.state.active !== null ? this.state.active : this.state.detail;\n    const cur = a === null ? null : TOOLS[a];\n    const detailOpen = this.state.detail !== null && this.state.detail === a;\n    const touched = this.state.touched;\n    const fault = !!(cur && cur.fault);\n    const openIdx = this.state.open;\n    const faultOpenM = openIdx !== null && !!TOOLS[openIdx] && !!TOOLS[openIdx].fault;\n\n    // Wird die Zange gewählt, wird die Klammer um alle drei Werkzeuge sichtbar.\n    const glow = (on, warm) => ({\n      background: on ? (warm ? \"rgba(26,39,68,0.5)\" : \"rgba(26,39,68,0.42)\") : \"rgba(0,0,0,0)\",\n      border: \"1px solid \" + (on ? (warm ? \"#FFFFFF\" : accent) : \"rgba(255,255,255,0)\"),\n      boxShadow: on\n        ? (warm ? \"0 0 26px rgba(255,255,255,0.5), inset 0 0 26px rgba(26,39,68,0.6)\" : \"0 0 24px rgba(26,39,68,0.75), inset 0 0 26px rgba(26,39,68,0.55)\")\n        : \"0 0 0 rgba(0,0,0,0)\",\n      transition: \"background 200ms ease, border-color 200ms ease, box-shadow 240ms ease\"\n    });\n\n    return {\n      isDesktop: desktop,\n      isMobile: !desktop,\n      zoom: desktop ? \"none\" : \"scale(1.42)\",\n      // Breite der scharfen Bildsäule. Der Deckel von 1160 px sorgt dafür, dass die\n      // ganze Wand auch auf einem breiten, flachen Bildschirm in eine Schirmhöhe\n      // passt — je breiter das Fenster, desto mehr unscharfer Streifen links und\n      // rechts. Die Werte sind ausgereizt: bei 80vw/1240px ragt der Abschnitt auf\n      // 1440x900 und 1920x950 unten aus dem Bild. Auf dem Handy bleibt die Säule\n      // bewusst breiter als der Schirm — der Ausschnitt zoomt dort auf ein Werkzeug.\n      saeuleW: desktop ? \"min(1160px, 76vw)\" : \"1080px\",\n      isArea: !fault,\n      isFault: fault,\n      excuses: EXCUSES,\n      panelTool: cur ? cur.tool : \"Bereit\",\n      panelKind: cur ? cur.kind : \"Drei Bereiche · ein Ansprechpartner\",\n      panelTitle: cur ? cur.title : \"Werkzeug wählen\",\n      panelBridge: cur ? cur.bridge : \"Jedes Werkzeug steht für einen Bereich, den wir für Sie übernehmen. Fahren Sie darüber — und dann über die grosse Zange, die quer darunter liegt.\",\n      panelExamples: cur && cur.examples ? cur.examples : [],\n      panelRef: this.panelRef,\n      benchStyle: {\n        position: \"relative\", width: \"100%\",\n        aspectRatio: \"1376 / 128\",\n        minHeight: this.state.benchPx ? this.state.benchPx + \"px\" : undefined,\n        // Nur der reine Bankstreifen wird gespiegelt — die Zange darf nicht doppelt erscheinen.\n        backgroundImage: 'url(\"' + ((window.__resources && window.__resources.wandImg) || \"assets/werkzeugwand-v3.png\") + '\")',\n        backgroundSize: \"cover\", backgroundPosition: \"50% 100%\",\n        backgroundRepeat: \"no-repeat\", transform: \"scaleY(-1)\",\n        transition: \"min-height 260ms ease\"\n      },\n      // Gleiche Höhe in beiden Zuständen, damit beim Umschalten nichts springt.\n      // Beide Textblöcke liegen in derselben Grid-Zelle — die Höhe ist automatisch das Maximum,\n      // dadurch bleibt das Feld beim Umschalten exakt gleich gross.\n      contentStyle: { marginTop: \"8px\", display: \"grid\", gridTemplateAreas: '\"stack\"', alignItems: \"start\", minHeight: cur ? \"3.45em\" : \"0\" },\n      bridgeStyle: {\n        gridArea: \"stack\", margin: 0, fontFamily: \"Georgia, serif\", fontStyle: \"italic\",\n        fontSize: \"clamp(14.5px, 1.4vw, 18px)\", lineHeight: 1.4, color: \"#DCE6F2\", textWrap: \"pretty\",\n        opacity: detailOpen ? 0 : 1, visibility: detailOpen ? \"hidden\" : \"visible\",\n        transition: \"opacity 180ms ease\"\n      },\n      examplesStyle: {\n        gridArea: \"stack\", display: \"grid\", gridTemplateColumns: \"repeat(3, 1fr)\",\n        gap: \"14px 22px\", alignItems: \"start\",\n        opacity: detailOpen ? 1 : 0, visibility: detailOpen ? \"visible\" : \"hidden\",\n        transition: \"opacity 180ms ease\"\n      },\n      // Platzhalter, damit der Zange-Zustand exakt so hoch ist wie die Bereichs-Panels.\n      btnSpacerStyle: { height: \"41px\" },\n      detailBtnLabel: detailOpen ? \"Schliessen\" : \"Was das konkret heisst\",\n      detailBtnStyle: {\n        marginTop: cur ? \"4px\" : \"0\", height: cur ? \"auto\" : \"0\", overflow: \"hidden\",\n        cursor: cur ? \"pointer\" : \"default\",\n        fontFamily: \"inherit\", fontWeight: 700, fontSize: \"13px\", letterSpacing: \"0.02em\",\n        padding: cur ? \"9px 16px\" : \"0 16px\", borderRadius: \"3px\", background: \"rgba(176,196,222,0.12)\",\n        color: accent, border: \"1px solid rgba(176,196,222,0.45)\",\n        opacity: cur ? 1 : 0, pointerEvents: cur ? \"auto\" : \"none\",\n        transition: \"opacity 200ms ease, background 200ms ease\"\n      },\n      toggleDetail: () => this.setState((s) => {\n        const idx = s.active !== null ? s.active : s.detail;\n        return { detail: s.detail === idx ? null : idx, active: idx };\n      }),\n      panelStyle: {\n        position: \"relative\", margin: \"0 auto\", pointerEvents: \"auto\",\n        width: \"min(78%, 900px)\",\n        background: \"linear-gradient(180deg, rgba(26,39,68,0.9) 0%, rgba(26,39,68,0.72) 62%, rgba(26,39,68,0.34) 100%)\",\n        backdropFilter: \"blur(3px)\",\n        borderLeft: \"3px solid \" + (fault ? \"#FFFFFF\" : accent),\n        boxShadow: fault ? \"inset 0 0 0 1px rgba(255,255,255,0.28)\" : \"none\",\n        borderRadius: \"4px\",\n        padding: \"clamp(14px, 1.6vw, 20px) clamp(18px, 2vw, 26px)\",\n        boxSizing: \"border-box\",\n        transition: \"width 240ms ease, border-color 240ms ease\"\n      },\n      // Die drei Verbindungslinien mit Dreiecksspitze sind am 03.08.2026 entfernt\n      // worden: die mittlere endete direkt über der ZANGE-Platte und las sich als\n      // Fremdkörper. Die Aussage «Support betrifft alle drei» trägt jetzt allein\n      // die Klammer mit dem Schild «gilt für alle drei».\n      // Zange aktiv → eine gemeinsame Klammer um die drei Werkzeuge.\n      bracketStyle: {\n        position: \"absolute\", left: \"25%\", top: \"11%\", width: \"53%\", height: \"48%\",\n        borderRadius: \"12px\", pointerEvents: \"none\",\n        background: fault ? \"rgba(26,39,68,0.28)\" : \"rgba(0,0,0,0)\",\n        border: \"1px solid \" + (fault ? \"rgba(255,255,255,0.85)\" : \"rgba(255,255,255,0)\"),\n        boxShadow: fault ? \"0 0 30px rgba(255,255,255,0.35), inset 0 0 40px rgba(26,39,68,0.35)\" : \"0 0 0 rgba(0,0,0,0)\",\n        transition: \"background 220ms ease, border-color 220ms ease, box-shadow 260ms ease\"\n      },\n      bracketLabelStyle: {\n        position: \"absolute\", left: \"50%\", transform: \"translateX(-50%)\", top: \"-28px\",\n        whiteSpace: \"nowrap\", fontFamily: \"Georgia, serif\", fontWeight: 700, fontSize: \"12.5px\",\n        letterSpacing: \"0.14em\", textTransform: \"uppercase\", color: \"#1A2744\",\n        background: \"#FFFFFF\", padding: \"4px 12px\", borderRadius: \"3px\",\n        opacity: fault ? 1 : 0, transition: \"opacity 220ms ease\"\n      },\n      hotspots: TOOLS.map((t, i) => {\n        const warm = !!t.fault;\n        // Einzelnes Werkzeug: nur dieses. Zange: nur die Zange selbst plus die Klammer.\n        const on = fault ? warm : a === i;\n        const onM = faultOpenM ? warm : openIdx === i;\n        const labelOn = fault ? warm : a === i;\n        const pos = { position: \"absolute\", left: t.box.left, top: t.box.top, width: t.box.width, height: t.box.height, borderRadius: \"10px\", cursor: \"pointer\", padding: 0 };\n        return {\n          tool: t.tool, title: t.title, bridge: t.bridge, isFault: warm, examples: t.examples || [],\n          boxStyle: { ...pos, ...glow(on, warm), zIndex: warm ? 2 : 1 },\n          boxStyleM: { ...pos, ...glow(onM, warm) },\n          labelStyle: {\n            position: \"absolute\", left: \"50%\", transform: \"translateX(-50%)\",\n            top: warm ? \"-16px\" : \"-30px\",\n            whiteSpace: \"nowrap\", zIndex: 3, fontFamily: \"Georgia, serif\", fontWeight: 700,\n            fontSize: \"13px\", letterSpacing: \"0.12em\", textTransform: \"uppercase\",\n            color: fault ? \"#FFFFFF\" : accent, background: \"rgba(26,39,68,0.92)\",\n            border: \"1px solid \" + (fault ? \"rgba(255,255,255,0.6)\" : \"rgba(176,196,222,0.6)\"),\n            padding: \"4px 10px\",\n            borderRadius: \"3px\", opacity: labelOn ? 1 : 0, transition: \"opacity 200ms ease\", pointerEvents: \"none\",\n            display: \"flex\", alignItems: \"center\", gap: \"8px\"\n          },\n          // Dauerhafter Punkt am Werkzeug: die übliche Hotspot-Markierung, wird beim Hovern kräftiger.\n          // Ruhezustand: kleiner Punkt. Hover: wird zur Pille «Beispiele ansehen» — das liest sich als Klick.\n          dotSign: detailOpen && a === i ? \"Schliessen\" : \"Infos\",\n          dotStyle: {\n            position: \"absolute\", left: \"50%\", transform: \"translateX(-50%)\",\n            bottom: \"-16px\",\n            display: \"flex\", alignItems: \"center\", justifyContent: \"center\", gap: \"6px\",\n            whiteSpace: \"nowrap\", height: \"25px\", padding: \"0 10px\", borderRadius: \"3px\",\n            fontFamily: \"-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif\",\n            fontSize: \"12px\", fontWeight: 700, letterSpacing: \"0.08em\", textTransform: \"uppercase\", lineHeight: 1,\n            background: warm ? \"#FFFFFF\" : accent, color: \"#1A2744\",\n            boxShadow: \"0 2px 10px rgba(0,0,0,0.4)\",\n            opacity: on ? 1 : 0, pointerEvents: \"none\", transition: \"opacity 180ms ease\"\n          },\n          rowStyle: {\n            width: \"100%\", minHeight: \"60px\", display: \"flex\", alignItems: \"center\", gap: \"14px\",\n            padding: \"14px 16px\", border: \"none\", cursor: \"pointer\", textAlign: \"left\",\n            color: \"inherit\", font: \"inherit\", transition: \"background 200ms ease\",\n            background: openIdx === i\n              ? (warm ? \"rgba(255,255,255,0.14)\" : \"rgba(176,196,222,0.1)\")\n              : (faultOpenM ? \"rgba(255,255,255,0.06)\" : \"rgba(255,255,255,0.03)\")\n          },\n          chipStyle: {\n            background: warm || faultOpenM ? \"#FFFFFF\" : accent, color: \"#1A2744\", fontWeight: 700,\n            fontSize: \"12px\", letterSpacing: \"0.1em\", textTransform: \"uppercase\",\n            padding: \"4px 8px\", borderRadius: \"3px\", transition: \"background 200ms ease\"\n          },\n          plusStyle: {\n            flex: \"none\", width: \"44px\", height: \"44px\", borderRadius: \"50%\",\n            border: \"1px solid rgba(176,196,222,0.4)\", display: \"grid\", placeItems: \"center\",\n            fontSize: \"22px\", lineHeight: 1, color: warm ? \"#FFFFFF\" : accent,\n            transform: openIdx === i ? \"rotate(45deg)\" : \"rotate(0deg)\", transition: \"transform 220ms ease\"\n          },\n          rows: openIdx === i ? \"1fr\" : \"0fr\",\n          // Hover zeigt immer die Analogie; Klick öffnet die Beispiele und hält sie offen.\n          // Zange nicht per Hover übernehmen, solange die Beispiele eines Werkzeugs offen sind —\n          // sonst verliert man den Text auf dem Weg nach unten.\n          enter: () => {\n            const apply = () => this.setState((s) => (s.detail !== null && s.detail !== i ? { active: i, detail: null } : { active: i }));\n            clearTimeout(this.hoverT);\n    clearTimeout(this.measureT);\n    if (this.pro) this.pro.disconnect();\n            // Zange: erst nach kurzem Verweilen übernehmen, damit man auf dem Weg nach unten durchfahren kann.\n            if (warm) this.hoverT = setTimeout(apply, 180);\n            else apply();\n          },\n          // Auswahl bleibt nach dem Verlassen stehen, damit der Button unten erreichbar ist.\n          leave: () => { if (warm) clearTimeout(this.hoverT); },\n          pin: () => this.setState((s) => (s.detail === i ? { detail: null, active: i, touched: true } : { detail: i, active: i, touched: true })),\n          toggle: () => this.setState((s) => ({ open: s.open === i ? null : i }))\n        };\n      })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
